name: Windows Installer (OnliDesk + OnliDeskWhatch)

# Gera o instalador InnoSetup do cliente Windows (OnliDesk com o modulo de
# monitoramento OnliDeskWhatch embutido). Compila numa imagem com o toolchain
# fixado (Flutter 3.24.5, LLVM 15, Rust 1.75, vcpkg pinado) — a via confiavel
# para o binario, ja que uma maquina de dev com toolchain bleeding-edge quebra
# o build nativo do vcpkg (ex.: aom vs NASM novo).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-watch"

env:
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  SCITER_RUST_VERSION: "1.75"
  # Mesmo baseline do vcpkg.json — traz um NASM compativel com o aom pinado.
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.6"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # Gera o flutter_rust_bridge (reutiliza o workflow existente).
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-windows-installer:
    name: build-windows-installer
    needs: [generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          # OnliDeskWhatch é submódulo de um repo PRIVADO (onlitec/OnliDeskWatch);
          # o GITHUB_TOKEN padrao nao acessa outro repo privado. Defina o secret
          # SUBMODULE_TOKEN (PAT com acesso de leitura a OnliDeskWatch). Cai para o
          # token padrao quando o secret nao existe (funciona se o submodulo for publico).
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@1a3da29f56261a1e1f937ec88f0856a9b8321d7e # v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Build OnliDesk (Flutter Windows Release, with monitoring)
        run: |
          python3 .\build.py --portable --hwcodec --flutter --vram --watch --skip-portable-pack

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $release = Resolve-Path ".\flutter\build\windows\x64\runner\Release"
          if (-not (Test-Path "$release\OnliDesk.exe")) {
            throw "OnliDesk.exe nao encontrado em $release"
          }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" "/DReleaseDir=$release" ".\OnliDeskWhatch\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o instalador (ISCC $LASTEXITCODE)" }
          Get-ChildItem ".\OnliDeskWhatch\OnliDesk-*-Watch-Setup.exe" | ForEach-Object {
            Write-Host "Instalador gerado: $($_.FullName) ($([math]::Round($_.Length/1MB)) MB)"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OnliDesk-${{ env.VERSION }}-Watch-Setup
          path: ./OnliDeskWhatch/OnliDesk-*-Watch-Setup.exe
          if-no-files-found: error
